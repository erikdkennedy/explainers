<!-- NB: no blank lines anywhere in this file — a blank line closes the Markdown HTML block
     and the rest of the SVG gets re-parsed as prose.
     Hand-authored from Figma nodes 1412:1040 / 1076 / 1274 / 1300 / 1512. The viewBox is the
     frame's stage column with the 58px header taken off the top and nothing else moved, so
     every coordinate in RM_CAST pastes in from the design file unchanged and the keyframe
     table can be audited against it line by line.
     The cast is fixed and small — eight atoms and seven connectors, each of which appears in
     at least one keyframe — so it is written out here rather than built in JS: eight
     near-identical groups read better than a loop that would have to name all the same parts
     anyway. Only the microwave pulse is seeded by quantum.js, because 166 dots would not.
     Nothing in this file is a resting state: positions, radii, opacities, arrow angles and
     connector geometry are all written per frame by renderRamsey(). -->
<svg viewBox="0 58 469 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="rm-stage-title" aria-describedby="rm-stage-desc">
<title id="rm-stage-title">One atom, split into phantom copies by two microwave pulses</title>
<desc id="rm-stage-desc">An atom drawn as a disc — blue and lettered G in its ground state, red and lettered E when excited — with a spinning arrow for its quantum probability. Microwave pulses split it into phantom copies; each copy’s arrow spins at a speed set by its energy, and copies whose arrows end up opposed cancel one another out.</desc>
<defs>
    <!-- Both heads keep their tip at the origin and neither grows with its shaft, exactly as
         Figma draws them: the arrowhead is the same 7.46 units across on the 41-long arrow and
         the 33-long one. So the shaft's length is the only thing JS has to write.
         The atom's head points up, because 0° is up and .rm-arrow rotates from there; the
         connector's points along +x, because a connector is a translate-and-rotate. -->
    <path id="rm-arrowhead" d="M-3.73 4.5L0 0L3.73 4.5"/>
    <path id="rm-connector-head" d="M0 0L-10 -5.75L-10 5.75Z"/>
</defs>
<!-- The pulse goes first, so the microwaves pass behind the copies they are splitting rather
     than across their faces. quantum.js seeds 166 circles in here at init and then moves the
     whole group with one transform per frame — every dot travels identically, so there is no
     per-dot maths to do the way there is in the emission widget. -->
<g class="rm-photons"></g>
<!-- Connectors sit above the pulse and below the atoms, so a head that overshoots its target
     is tucked under the disc it points at instead of drawn over it. -->
<g class="rm-connector" data-connector="orig:e1"><rect class="rm-connector-shaft"/><use class="rm-connector-head" href="#rm-connector-head"/></g>
<g class="rm-connector" data-connector="orig:g1"><rect class="rm-connector-shaft"/><use class="rm-connector-head" href="#rm-connector-head"/></g>
<g class="rm-connector" data-connector="e1:e2a"><rect class="rm-connector-shaft"/><use class="rm-connector-head" href="#rm-connector-head"/></g>
<g class="rm-connector" data-connector="e1:g2b"><rect class="rm-connector-shaft"/><use class="rm-connector-head" href="#rm-connector-head"/></g>
<g class="rm-connector" data-connector="g1:e2b"><rect class="rm-connector-shaft"/><use class="rm-connector-head" href="#rm-connector-head"/></g>
<g class="rm-connector" data-connector="g1:g2a"><rect class="rm-connector-shaft"/><use class="rm-connector-head" href="#rm-connector-head"/></g>
<g class="rm-connector" data-connector="g2b:result"><rect class="rm-connector-shaft"/><use class="rm-connector-head" href="#rm-connector-head"/></g>
<!-- One atom, four parts, and the paint order inside is load-bearing: halo, arrow, disc,
     letter. The arrow runs from the atom's own centre, so the disc is what hides its inner
     half — only the part past the rim is ever seen, which is why there is no tail dot here
     even though Figma draws one; at every radius in this widget it is occluded.
     Putting the halo underneath keeps its 20% wash off the one hairline in the picture that
     has to stay crisp. -->
<g class="rm-atom" data-copy="orig" data-state="ground"><circle class="rm-atom-halo"/><g class="rm-arrow"><rect class="rm-arrow-shaft"/><g class="rm-arrow-tip"><use class="rm-arrow-head" href="#rm-arrowhead"/></g></g><circle class="rm-atom-disc"/><text class="rm-atom-letter">G</text></g>
<g class="rm-atom" data-copy="e1" data-state="excited"><circle class="rm-atom-halo"/><g class="rm-arrow"><rect class="rm-arrow-shaft"/><g class="rm-arrow-tip"><use class="rm-arrow-head" href="#rm-arrowhead"/></g></g><circle class="rm-atom-disc"/><text class="rm-atom-letter">E</text></g>
<g class="rm-atom" data-copy="g1" data-state="ground"><circle class="rm-atom-halo"/><g class="rm-arrow"><rect class="rm-arrow-shaft"/><g class="rm-arrow-tip"><use class="rm-arrow-head" href="#rm-arrowhead"/></g></g><circle class="rm-atom-disc"/><text class="rm-atom-letter">G</text></g>
<g class="rm-atom" data-copy="e2a" data-state="excited"><circle class="rm-atom-halo"/><g class="rm-arrow"><rect class="rm-arrow-shaft"/><g class="rm-arrow-tip"><use class="rm-arrow-head" href="#rm-arrowhead"/></g></g><circle class="rm-atom-disc"/><text class="rm-atom-letter">E</text></g>
<g class="rm-atom" data-copy="e2b" data-state="excited"><circle class="rm-atom-halo"/><g class="rm-arrow"><rect class="rm-arrow-shaft"/><g class="rm-arrow-tip"><use class="rm-arrow-head" href="#rm-arrowhead"/></g></g><circle class="rm-atom-disc"/><text class="rm-atom-letter">E</text></g>
<g class="rm-atom" data-copy="g2a" data-state="ground"><circle class="rm-atom-halo"/><g class="rm-arrow"><rect class="rm-arrow-shaft"/><g class="rm-arrow-tip"><use class="rm-arrow-head" href="#rm-arrowhead"/></g></g><circle class="rm-atom-disc"/><text class="rm-atom-letter">G</text></g>
<g class="rm-atom" data-copy="g2b" data-state="ground"><circle class="rm-atom-halo"/><g class="rm-arrow"><rect class="rm-arrow-shaft"/><g class="rm-arrow-tip"><use class="rm-arrow-head" href="#rm-arrowhead"/></g></g><circle class="rm-atom-disc"/><text class="rm-atom-letter">G</text></g>
<g class="rm-atom" data-copy="result" data-state="ground"><circle class="rm-atom-halo"/><g class="rm-arrow"><rect class="rm-arrow-shaft"/><g class="rm-arrow-tip"><use class="rm-arrow-head" href="#rm-arrowhead"/></g></g><circle class="rm-atom-disc"/><text class="rm-atom-letter">G</text></g>
</svg>
