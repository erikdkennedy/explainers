<!-- TEMPORARY, for choosing between the three sidenote treatments. Delete this include, its
     block in _posts.scss, and the initSidenoteSwitcher() section of post.js once a variant
     is picked. Style also selectable with ?sidenotes=a|b|c, and remembered in localStorage. -->
<div class="sn-switcher" role="group" aria-label="Sidenote style">
    <span class="sn-switcher__label">Sidenotes</span>
    <button type="button" class="sn-switcher__btn" data-sn-style="a">A · Asterisk</button>
    <button type="button" class="sn-switcher__btn" data-sn-style="b">B · Numbered</button>
    <button type="button" class="sn-switcher__btn" data-sn-style="c">C · Wired</button>
</div>
