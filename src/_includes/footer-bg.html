<div class="footer-bg">
	<div data-us-project-src="/assets/unicorn/rn2JFkOAbWLcxXSyOBH6.json" style="width: 100%; height: 100%;"></div>
	<script type="text/javascript">
		/*
			The bundle is 171 KB and opens a live WebGL context, for a decorative panel behind
			the footer of a 10,000-word article. It used to be a bare <script src> in the middle
			of the <footer>, which blocks the parser there — and the init below sat in a second
			inline script that only worked *because* of that blocking, so adding `defer` to the
			old tag would have silently shipped 171 KB that did nothing. Fetching it from here
			instead makes the ordering explicit: the script is created when the footer comes
			near, and init hangs off its own onload rather than off a guard that happens to run
			at the right moment.
		*/
		(function () {
			var host = document.currentScript.parentNode;
			var started = false;

			function load() {
				if (started) return;
				started = true;
				var s = document.createElement('script');
				s.src = '/assets/js/unicornStudio.umd.js';
				s.onload = function () {
					if (window.UnicornStudio && window.UnicornStudio.init) {
						UnicornStudio.init().catch(function (err) { console.error(err); });
					}
				};
				document.head.appendChild(s);
			}

			if (!('IntersectionObserver' in window)) { load(); return; }
			var io = new IntersectionObserver(function (entries) {
				for (var i = 0; i < entries.length; i++) {
					if (entries[i].isIntersecting) { io.disconnect(); load(); return; }
				}
			}, { rootMargin: '300px' });
			io.observe(host);
		})();
	</script>
</div>
